services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tsg_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 5001 --reload
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "5001:5001"
    environment:
      - ENVIRONMENT=development
      - PORT=5001
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5001
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development # Geliştirme aşamasını hedefle
    container_name: tsg_frontend
    ports:
      - "3000:3000" # Geliştirme sunucusu portu
    volumes:
      - ./frontend:/app # Kod senkronizasyonu
      - /app/node_modules # node_modules'ın üzerine yazılmasını engelle
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:5001
    command: yarn dev # Geliştirme sunucusunu başlat
    depends_on:
      - backend
    restart: unless-stopped

