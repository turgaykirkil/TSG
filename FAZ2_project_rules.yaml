ProjeTanımıVeAmacı: |
    Bu faz, **Ticaret Sicil Gazetesi** web sitesinden şirket kayıtlarının toplanması ve OCR ile işlenmesini içerir. 
    Kullanıcı, sistem aracılığıyla ticaret sicil gazetesi belgelerini (PDF) elde edecek; ancak site girişinde bulunan CAPTCHA engeli, 
    yapay yöntemlerle değil, **manuel doğrulama** veya yavaş ve dikkatli isteklerle etik biçimde aşılacaktır. 
    İndirilen PDF dokümanları OCR teknolojisi ile metne dönüştürülerek, her sayfanın her bir **sütun**u ve varsa tablolardaki bilgiler ayrı ayrı yakalanacak şekilde veritabanına kaydedilir. 
    Böylece sistem, ticaret odası PDF’lerinin yanı sıra resmi gazete verilerini de depolayarak daha kapsamlı bir veri havuzu oluşturur ve sonraki analizler için zemin hazırlar.
TeknikBileşenler:
    Backend:
        DilVeÇerçeve: "Python (FastAPI)"
        Açıklama: "Backend’e Ticaret Sicil Gazetesi veri toplama modülü entegre edilecek. 
                   Örneğin, Python `requests` + `BeautifulSoup` kullanarak gazete arama sonuçlarından PDF indiren bir yardımcı modül (scraper) yazılır. 
                   Bu modül, CAPTCHA ile korunduğu için otomasyonu sınırlı olacak; gerektiğinde FastAPI, CAPTCHA görselini kullanıcıya iletip kullanıcıdan gelen kod ile isteği tamamlayacak şekilde tasarlanır."
    Frontend:
        Teknoloji: "React"
        Açıklama: "İsteğe bağlı olarak yöneticinin gazete verisi çekmesini kolaylaştıran bir arayüz eklenebilir. 
                   Örneğin, bir **“Gazete Verisi Ekle”** formu ile kullanıcıdan şirket adı veya sicil no alınıp arka uçta scraping işlemi tetiklenir. 
                   CAPTCHA gerekiyorsa, backend’in gönderdiği CAPTCHA görüntüsü bu arayüzde gösterilip kullanıcıdan kod girişi alınır ve tekrar backend’e gönderilir. 
                   (Not: CAPTCHA çözümü tam otomatik olmadığından, kullanıcı etkileşimli bir adım olacaktır.)"
    Veritabanı:
        Teknoloji: "SQLite"
        Açıklama: "Veritabanı şemasına eklemeler yapılacak. Örneğin `gazette_entries` adında bir tablo ile 
                   **gazete_id**, **yayın_tarihi**, **sicil_no**, **unvan**, **metin** gibi alanlar tutulur. 
                   OCR sonucu metin, birden fazla satıra bölünebileceğinden, sayfa numarası ve sütun numarası bilgisi de ayrı alanlar olarak kaydedilir 
                   (örn. `sayfa_no`, `sutun_no`, `metin`). Böylece bir gazete PDF’inin yapısal metin içeriği tam olarak veritabanında temsil edilir."
    OCR:
        Teknoloji: "Tesseract OCR, EasyOCR"
        Açıklama: |
            Gazete PDF'lerinin metne dönüştürülmesi için ücretsiz ve yüksek kaliteli OCR çözümleri kullanılacak. 
            Birincil tercih, Google'ın açık kaynaklı **Tesseract OCR** motorudur (Türkçe dil desteğiyle ve yüksek doğruluk oranıyla tanınır [oai_citation:0‡medium.com](https://medium.com/@semihaslann/iosda-tesseract-ile-ocr-uygulamas%C4%B1-82401a337a2c#:~:text=,motorlar%C4%B1ndan%20biri%20olarak%20kabul%20edilir)). 
            Tesseract hızlı ve ücretsiz olup gazete sayfalarını metne çevirmede etkilidir. 
            Alternatif olarak, derin öğrenme tabanlı **EasyOCR** kütüphanesi de (Türkçe karakterleri tanıyabilen) değerlendirilebilir. 
            OCR işlemlerinde her PDF sayfası için sütunlar ayrı ayrı işlenir; örneğin, sayfa görüntüsü ortadan ikiye bölünerek sol ve sağ sütunlar ayrı OCR yapılır. 
            Elde edilen metinler sayfa/sütun numarası ile birlikte veritabanına kaydedilir.
    WebScraping:
        Yöntem: "Python Requests + BeautifulSoup (CAPTCHA için manuel yardım ile)"
        Açıklama: |
            Ticaret Sicil Gazetesi web sitesinden veri çekmek için **web scraping** teknikleri kullanılacaktır. 
            Ancak sitede bulunan CAPTCHA, etik ve dikkatli bir yaklaşımla aşılmalıdır: Sistem, CAPTCHA görüntüsünü kullanıcıya gösterip kod girişi alarak ilerler. 
            Otomatik çözümler (üçüncü parti CAPTCHA servisi vb.) tercih edilmez. 
            Scraping sırasında siteye aşırı yüklenmemek için istekler arasına gecikme konulacak ve **robots.txt** ile kullanım şartlarına riayet edilecektir. 
            Tipik süreç: kullanıcı belirli bir şirket için sorgu ister, sistem arama formuna isteği gönderir (CAPTCHA koduyla birlikte), dönen sayfadaki PDF linklerini parse edip ilgili PDF’i indirir ve OCR işlemine alır.
    GrafikAnalizi:
        Durum: "Yok"
        Açıklama: "Bu aşamada henüz grafiksel analiz bulunmuyor; toplanan veri sonraki fazda görselleştirilecektir."
KodÖrnekleri:
    - Açıklama: "Python ile indirilen bir PDF dosyasını OCR ile işleme (pdf2image + pytesseract örneği)"
      Kod: |
        from pdf2image import convert_from_path
        from PIL import Image
        import pytesseract
        
        # Gazete PDF'ini sayfa görüntülerine dönüştür (her sayfa PNG olarak)
        pages = convert_from_path('gazete.pdf', fmt='png')
        extracted_texts = []
        for idx, page_img in enumerate(pages, start=1):
            # Her sayfayı iki sütuna bölüp OCR yap (örnek olarak sayfa genişliğinin yarısından kesiyoruz)
            width, height = page_img.size
            left_half = page_img.crop((0, 0, width/2, height))
            right_half = page_img.crop((width/2, 0, width, height))
            text_left = pytesseract.image_to_string(left_half, lang='tur')
            text_right = pytesseract.image_to_string(right_half, lang='tur')
            extracted_texts.append({
              "sayfa": idx,
              "sutun1": text_left,
              "sutun2": text_right
            })
        # extracted_texts listesi artık her sayfa için sütun metinlerini içeriyor
    - Açıklama: "Requests ile web sayfasından içerik indirme ve CAPTCHA çözümü (basit akış şeması)"
      Kod: |
        import requests
        sess = requests.Session()
        # 1. Arama formunu çek (içerisinde CAPTCHA vardır)
        resp = sess.get("https://ticaretsicil.gov.tr/gazete/arama")
        # 2. CAPTCHA görüntüsünü kaydet ve manuel doğrulama al
        open("captcha.jpg", "wb").write(resp.content_of_captcha)
        print("Lütfen 'captcha.jpg' dosyasındaki kodu girin:")
        code = input().strip()
        # 3. CAPTCHA kodunu ve arama kriterlerini göndererek formu gönder
        data = { "captcha": code, "aranan_sicil_no": "123456" }
        resp2 = sess.post("https://ticaretsicil.gov.tr/gazete/arama", data=data)
        # 4. Sonuç sayfasından PDF linkini çıkar ve PDF'i indir
        pdf_url = extract_pdf_url(resp2.text)         # HTML içinden PDF linkini bul
        pdf_resp = sess.get(pdf_url)
        open("sonuc.pdf", "wb").write(pdf_resp.content)
DosyaDizinYapısı: |
    proje_kök_dizini/
        backend/
            scraper.py        # Ticaret Sicil Gazetesi scraping işlevleri (istek atma, HTML parse etme)
            ocr.py            # OCR ve PDF işleme fonksiyonları (Tesseract entegrasyonu vb.)
            main.py           # (Güncellenmiş) FastAPI uygulaması; yeni endpointler (örn. /fetch_gazette) eklenebilir
            database.sqlite   # SQLite veritabanı (yeni tablo ve alanlarla güncellendi)
            requirements.txt  # Yeni eklenen kütüphaneler: pytesseract, pdf2image, beautifulsoup4 vs.
        frontend/
            src/
                components/
                    GazetteImportForm.js  # (Opsiyonel) Ticaret Sicil Gazetesi'nden veri çekmek için form + CAPTCHA girişi
                App.js        # Uygulama rotaları (örn. GazeteImportForm sayfası) ve genel durum yönetimi
            public/
                index.html    # (Güncellenmiş) Gerekliyse CAPTCHA görüntüsünü göstermek için bir <img> placeholder vb.
            package.json      # Frontend bağımlılıkları (örn. yeni kütüphaneler eklendi ise listesi)
        data/
            gazette_pdfs/     # İndirilen gazete PDF arşivi (her PDF isteğe bağlı olarak saklanabilir)
            tessdata/         # Tesseract Türkçe dil dosyası (ör. `tur.traineddata`) konulabilir
        logs/
            scraping.log      # Web scraping ve OCR süreçlerine dair loglar
DikkatEdilmesiGerekenler:
    - "Web scraping işlemi hedef siteye yük getirmeyecek şekilde yapılmalıdır; çok sayıda sayfa çekilmesi gerekiyorsa **kademeli** ve gecikmeli ilerlenmeli, gerekirse işlemi parçalara bölmelidir."
    - "CAPTCHA doğrulaması manuel olduğundan, kullanıcı deneyimi için sistem bu adımı anlaşılır kılmalı (örn. 'Lütfen ekranda görünen kodu giriniz' şeklinde yönergeler). Yanlış girilirse tekrar deneme imkanı sunulmalıdır."
    - "OCR sonuçlarında olası karakter hatalarına karşı dikkat edilmeli; özellikle Türkçe **ş,ı,ğ,İ** gibi karakterlerin doğru tanındığından emin olmak için Tesseract'ın Türkçe dil paketi kullanılmalıdır. 
         Gerekirse yaygın OCR yanlışları (ör. 'İ' yerine 'I') metin kaydında düzeltilmelidir."
    - "Gazete sayfalarında **tablo** yapıları olabilir; OCR sonrasında tablo verilerinin anlaşılabilir olması için gerekirse özel işlem yapılmalı (ör. tabloları CSV yapısına çevirmek veya hücreleri ayırmak gibi). Bu, ileriki analizler için verinin tutarlılığını artırır."
Güvenlikİlkeleri:
    - "Scraping modülü harici bir siteyle etkileşimli olduğundan, gelen HTML/PDF verileri parse edilirken güvenli kütüphaneler kullanılmalı ve beklenmedik durumlara karşı (ör. çok büyük dosya, timeout) uygun istisna yakalama mekanizmaları olmalıdır."
    - "OCR işlemi için sistemde Tesseract gibi harici bir program kullanılıyorsa, komut satırı çağrıları güvenli şekilde yapılmalı (Python `pytesseract` kullanımı bu açıdan güvenlidir, doğrudan exe çağırmaz). 
         Yine de, kullanıcıdan gelen hiçbir veri bu komutlara parametre olarak kontrolsüz verilmemelidir."
    - "Elde edilen veriler genel olarak açık kaynaklı/genele açık bilgiler olsa da, sistemin bu verileri barındırması sırasında yetkisiz erişime karşı önlem alınmalı. 
         (Örneğin ileride web uygulaması internete açılırsa, veritabanına veya upload endpoint’ine sadece yetkili kullanıcıların eriştiğinden emin olunmalıdır.)"
Testİlkeleri:
    - "Scraping kodu için birim testlerinde gerçek siteye istek yapılmadan çalışılabilir: Örneğin, daha önce kaydedilmiş bir HTML sayfası dosyasını `scraper.py` içindeki parse fonksiyonuna verip doğru şekilde PDF linki çıkardığı test edilmelidir."
    - "OCR süreci için, bilinen çıktı metni olan küçük bir örnek PDF kullanılarak uçtan uca test yapılmalı. Bu PDF sisteme verildiğinde, OCR sonucu metnin veritabanına doğru şekilde kaydedildiği ve sütun/sayfa bilgilerinin tutarlılığı doğrulanmalıdır."
    - "Yeni eklenen özelliklerin tüm entegrasyonu için entegrasyon testleri düşünülmeli: Örneğin, **sahte bir CAPTCHA** senaryosu oluşturulup (CAPTCHA doğrulamasını her seferinde doğru kabul eden bir test modu ile) 
         scraping + OCR akışı baştan sona otomatik test edilebilir."
Loglamaİlkeleri:
    - "Scraping sırasında her kritik adım loglanmalı: istek yapılan URL’ler, HTTP cevap durumları, indirilen PDF'in adı vs. **info** seviyesinde kaydedilebilir. 
         CAPTCHA doğrulaması başarısız olursa bu durum **warning** seviyesinde loglanmalıdır."
    - "OCR işlemi yaparken her sayfa veya her dosya bazında ayrı log girdisi tutulabilir. Örneğin 'Gazete 2021-0101.pdf sayfa 3 OCR tamamlandı, 500 karakter çıkarıldı' şeklinde debug log ile detay verilebilir."
    - "Log dosyalarının boyutu kontrol altında tutulmalı (rotasyon veya günlük log tutma yaklaşımı). Özellikle OCR çıktısı çok büyük metinler içeriyorsa, bu metinler log yerine dosya veya veritabanında tutulduğu için loglara tam metin yazılmamalıdır."
Erişilebilirlikİlkeleri:
    - "CAPTCHA adımı için sunulan arayüzde, görüntüye alternatif metin (`alt` açıklaması) eklenmeli (örn. `'Doğrulama kodu görüntüsü'`). Ekran okuyucular görsel CAPTCHA'yı çözemese de, 
         en azından kullanıcıya bu adımın varlığı ve ne yapması gerektiği konusunda açıklama sağlanmalıdır."
    - "Ön yüze eklenen yeni form bileşenleri (gazete veri çekme formu, CAPTCHA input vb.), standartlara uygun şekilde etiketlenmeli. Form elemanları için `<label>` kullanımı ve uygun ARIA alanları eklenmelidir."
    - "Renkli durum göstergeleri (örn. başarı/başarısızlık mesajları) varsa, renk körlüğü olan kullanıcılar için ikincil bir gösterge de sunulmalıdır (ör. yeşil onay yazısının yanında bir ✓ ikonu, kırmızı hata mesajının yanında uyarı ikonu gibi)."
