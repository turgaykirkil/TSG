<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sicilius — Cloudflare Pages Önizleme</title>
  <meta name="description" content="Sicilius platformu için kurumsal ağda erişim testi." />
  <style>
    :root {
      --bg: #0b1020;
      --fg: #e6eefc;
      --muted: #9fb3d9;
      --grad1: #0A192F;
      --grad2: #1E3A8A;
      --grad3: #0EA5E9;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: grid; place-items: center; min-height: 100vh;
      background: radial-gradient(1200px 800px at 50% 20%, #0b1b3a, #060b18 70%);
      color: var(--fg); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica Neue, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }
    .card {
      width: min(92vw, 720px);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 32px 28px;
      backdrop-filter: blur(6px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    h1 {
      margin: 0 0 8px; font-size: clamp(28px, 5vw, 40px); font-weight: 700;
      background: linear-gradient(90deg, var(--grad1), var(--grad2), var(--grad3));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    p { margin: 8px 0; color: var(--muted); line-height: 1.6; }
    .badge {
      display: inline-block; font-size: 12px; padding: 6px 10px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18); color: var(--fg); opacity: 0.9;
    }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
    .hint {
      display:inline-block; padding:8px 12px; border-radius:999px; border:1px solid rgba(255,255,255,0.12);
      color:#cfe0ff; background: rgba(255,255,255,0.03);
    }
    footer { margin-top: 18px; font-size: 12px; opacity: 0.6; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Cloudflare Pages Testi</span>
    <h1>Sicilius</h1>
    <p>Bu sayfa, kurumsal ağlarda erişim engeli olup olmadığını hızlıca test etmek için hazırlanmış statik bir önizlemedir.</p>
    <div class="row" aria-label="İpuçları">
      <span class="hint">Statik içerik — backend gerekmez</span>
      <span class="hint">HTTPS — pages.dev alan adı</span>
      <span class="hint">Modern UI</span>
    </div>
    <footer>© 2025 Sicilius</footer>
  </main>
</body>
</html>
