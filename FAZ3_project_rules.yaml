ProjeTanımıVeAmacı: |
    Bu faz, sistemin elindeki veriler kullanılarak **şirketler arası ilişkisel analiz** yapılmasını sağlar. 
    OCR ile veritabanına aktarılmış metinler taranarak, şirketlerin ortak paylaştığı kişi isimleri, adresler veya diğer bilgiler üzerinden bağlar kurulacaktır. 
    Kullanıcı, web arayüzündeki kapsamlı bir sorgulama ekranı aracılığıyla bir şirket adı girdiğinde, o şirketin diğer şirketlerle hangi ortak noktalar üzerinden ilişkili olduğunu **ağ grafiği** şeklinde görebilir. 
    Grafik arayüzü, tarayıcıda çalışan D3.js veya Cytoscape.js tabanlı bir kütüphane ile etkileşimli olarak oluşturulur. 
    Sonuç olarak kullanıcı, örneğin **ortak yönetim kurulu üyeleri** veya **ortak adres** gibi bağlantılarla birbirine bağlı şirketleri görsel olarak keşfedebilir; bu da dolaylı ortaklıkları ve şirket ağlarını analiz etmeyi mümkün kılar.
TeknikBileşenler:
    Backend:
        DilVeÇerçeve: "Python (FastAPI)"
        Açıklama: "Arka uçta, ilişkisel analiz için bir servis ve veri işleme modülü eklenecek. 
                   Örneğin, veritabanındaki şirket kayıtlarının metinlerinde geçen **kişi isimleri** çıkarılarak bir `persons` tablosunda tutulur. 
                   Her bir şirketin ilişkili olduğu kişiler ve bu kişilerin diğer şirketlerdeki rolleri eşleştirilerek bir **ilişki grafı** verisi hazırlanır. 
                   Bu mantık Python içinde gerçekleştirilecek (gerekirse `networkx` gibi grafik kütüphaneleri kullanılarak). 
                   FastAPI, kullanıcı sorgularını alıp ilgili şirketin ilişkilerini düğüm-ve-kenar listesi olarak JSON formatında dönen bir endpoint (örn. **GET /relations/{company_name}**) sağlar."
    Frontend:
        Teknoloji: "React + D3.js/Cytoscape.js"
        Açıklama: "Ön yüzde, şirket ilişkilerini görselleştiren interaktif bir grafik bileşeni olacaktır. 
                   Bu bileşen, **Cytoscape.js** veya **D3.js** kullanarak şirketleri ve kişileri düğümler olarak, aralarındaki bağlantıları kenarlar olarak çizer. 
                   Kullanıcı bir şirket aradığında, grafik üzerinde o şirket merkezi alınarak ilgili diğer şirketler ve bağlayıcı kişiler gösterilir. 
                   Arayüzde arama/filtreleme çubuğu, grafiği yeniden düzenleme (layout) seçenekleri ve yakınlaştırma/uzaklaştırma gibi etkileşimli kontroller bulunur. 
                   Kullanıcı bir düğüme tıkladığında, o düğümün detayları (ör. kişi ise adı soyadı ve ilgili tüm şirketler; şirket ise unvanı, sicil no vb.) görüntülenir."
    Veritabanı:
        Teknoloji: "SQLite"
        Açıklama: "İlişki analizini hızlandırmak için veritabanı yapısı zenginleştirilir. 
                   Örneğin, OCR metinlerinden tespit edilen **kişiler** ayrı bir `persons` tablosuna, 
                   şirket-kişi ilişkileri de `company_person` adlı bir ilişki tablosuna kaydedilebilir (bir kişinin birden çok şirkette yer alması durumunda). 
                   Bu yapı, belirli bir şirketin hangi kişiler aracılığıyla diğer şirketlere bağlı olduğunun hızlıca sorgulanmasını sağlar. 
                   Alternatif yaklaşım olarak, metin içinde **doğrudan arama** ile de ilişkiler bulunabilir fakat bu daha yavaştır; yapılandırılmış tablo yaklaşımı tercih edilir. 
                   Veritabanına gerekirse **indeksler** eklenerek sorgulama performansı artırılır."
    OCR:
        Durum: "Mevcut (iyileştirme mümkün)"
        Açıklama: "Bu aşamada yeni bir OCR teknolojisi eklenmez, ancak mevcut OCR çıktılarının doğruluğu analiz edilir. 
                   İlişki çıkarımı sırasında hatalı tanınmış isimler tespit edilirse (ör. 'O' harfi '0' olarak algılanmışsa), bunları düzeltmek için bir **düzeltilmiş isim haritası** uygulanabilir. 
                   OCR kalitesini artırmak adına ek ön işlemler (görüntü iyileştirme, gürültü azaltma) opsiyonel olarak değerlendirilebilir."
    WebScraping:
        Durum: "Mevcut (güncellenebilir)"
        Açıklama: "Önceki fazdaki web scraping modülü, yeni yayınlanan Ticaret Sicil Gazetesi kayıtlarını çekmek için periyodik bir göreve dönüştürülebilir. 
                   Örneğin haftalık olarak yeni sayıların PDF’leri indirilebilir ve OCR ile işlenerek veritabanına eklenir. 
                   Bu sayede ilişki analizi her zaman güncel kalır. (Not: Bu gelişmiş bir kullanım senaryosudur; temel işlevsellik için zorunlu değildir.)"
    GrafikAnalizi:
        Teknoloji: "Web tabanlı grafik kütüphanesi (D3.js veya Cytoscape.js)"
        Açıklama: "Grafik analizi, tarayıcı üzerinde çalışan bir kütüphane ile sağlanır. 
                   **D3.js** düşük seviye esneklik sunarken, **Cytoscape.js** ağ grafikleri için yüksek seviye API sağlar. Bu projede, hızlı prototipleme için Cytoscape.js seçilebilir. 
                   Grafik tarafında düğümler iki tip olacak: **Şirket** düğümleri ve **Kişi** düğümleri. Bunlar şekil veya renkle ayırt edilir (ör. şirketler daire, kişiler kare; veya farklı renk kodları). 
                   Kenarlar ise hangi ortaklık üzerinden bağlantı kurulduğunu yansıtacak şekilde etiketlenebilir (örn. kenar üzerine \"ortak yönetici\" gibi bir etiket). 
                   Grafik düzeni için kuvvet yönlendirmeli (force-directed) veya \"cose\" (coefficient springs) gibi otomatik yerleşim algoritmaları kullanılacak. 
                   Yaklaşık 100-200 düğüme kadar grafik performanslı çalışır; daha büyük ağlar için filtreleme ve gruplayarak gösterme özellikleri düşünülmüştür."
KodÖrnekleri:
    - Açıklama: "Python (SQLAlchemy pseudo-code) ile ortak kişiler üzerinden ilişkili şirketleri bulma"
      Kod: |
        # Varsayım: Company ve Person modelleri ORM ile tanımlı ve aralarında many-to-many ilişki var (Company.persons, Person.companies).
        def get_related_companies(company_name):
            company = session.query(Company).filter_by(name=company_name).first()
            if not company:
                return []
            related_companies = set()
            for person in company.persons:          # İlgili şirketin tüm kişi kayıtlarını al
                for comp in person.companies:       # Her bir kişi için, o kişinin diğer şirketlerini al
                    if comp.name != company_name:
                        related_companies.add(comp.name)
            return list(related_companies)
        # Bu fonksiyon, verilen şirketle aynı kişileri paylaşan diğer şirketlerin isimlerini döndürür.
        # Not: Gerçek uygulamada doğrudan SQL JOIN ile de benzer sonuç alınabilir.
    - Açıklama: "Cytoscape.js ile tarayıcıda basit bir ilişkiler grafiği oluşturma örneği"
      Kod: |
        <div id="cy"></div>
        <script src="https://unpkg.com/cytoscape@3.21.0/dist/cytoscape.min.js"></script>
        <script>
          var cy = cytoscape({
            container: document.getElementById('cy'),
            elements: [
              { data: { id: 'CompanyA', label: 'Şirket A' } },
              { data: { id: 'PersonX', label: 'Kişi X' } },
              { data: { source: 'CompanyA', target: 'PersonX' } }
            ],
            style: [
              { selector: 'node', style: { 'content': 'data(label)', 'background-color': '#0074D9', 'font-size': '12px' } },
              { selector: 'edge', style: { 'line-color': '#ccc', 'target-arrow-shape': 'triangle' } }
            ],
            layout: { name: 'cose' }
          });
        </script>
DosyaDizinYapısı: |
    proje_kök_dizini/
        backend/
            analysis.py      # Şirket metinlerini işleyip kişi ve ilişkileri çıkaran analiz modülü
            main.py          # FastAPI uygulaması (güncellenmiş): yeni /relations endpointi ile grafik verisi sağlar
            models.py        # ORM modelleri (Company, Person, CompanyPerson ilişki tablosu tanımı gibi)
            database.sqlite  # SQLite veritabanı (ilişkisel analiz için tablolar eklenmiş hali)
        frontend/
            src/
                components/
                    GraphView.js    # Cytoscape.js kullanan, ilişkisel ağ grafiğini render eden React bileşeni
                    SearchBar.js    # Şirket arama ve filtreleme arayüzü bileşeni
                App.js            # Yeni rota (ör. "/graph") ve durum yönetimi, GraphView ile SearchBar’ın entegrasyonu
            public/
                index.html        # Cytoscape.js kütüphanesinin dahil edildiği HTML, ve <div id="cy"> konteyneri
            package.json         # Frontend bağımlılıkları (cytoscape veya d3 kütüphaneleri eklendi)
        logs/
            app.log           # Uygulama genel logları (scraping, OCR ve analiz süreçlerinin hepsi birleştirilebilir)
DikkatEdilmesiGerekenler:
    - "Veri kalitesi: İlişki analizinin doğruluğu, OCR ile tanınan isimlerin doğruluğuna bağlı. Aynı kişinin ismi farklı yazılmışsa (örneğin 'Ahmet Yılmaz' vs 'Ahmet YILMAZ'), sistem bunları ayrı kişi sanabilir. 
         Bu nedenle birleştirme (data cleaning) kuralları belirlenmeli (harf büyüklüğü gözardı etme, kısaltmaları açma vb.)."
    - "Grafik karmasıklığı: Çok sayıda şirket ve kişinin ilişki içinde olduğu durumlarda grafiğin anlaşılması zorlaşır. 
         Uygulama, kullanıcıya filtreler sunmalıdır (belirli bir kişi etrafında sınırlı gösterim, belirli şirket gruplarını gizleme gibi) veya otomatik olarak önemsiz düğümleri gizleyebilir."
    - "Performans: İlişki sorguları veritabanında kompleks JOIN işlemleri gerektirebilir. 
         Veri büyüdükçe sorgu sürelerini kontrol etmek için indeksleme, gerekirse ön belleğe alma (caching) stratejileri uygulanmalıdır. 
         Benzer şekilde, front-end tarafında 100’den fazla düğüm/kenar içeren grafikleri çizmek tarayıcıyı zorlayabilir; bu durumda sanal kaydırma veya kademeli yükleme teknikleri düşünülmelidir."
    - "Kullanıcı girişleri: Arama çubuğuna girilen şirket adlarının veritabanındaki kayıtlara tam uymaması durumunda (ör. yazım hatası), 
         en yakın eşleşmeyi bulma veya kullanıcıya öneriler sunma (auto-complete) özelliği eklenmesi iyi olur. Bu, kullanıcı deneyimini iyileştirir ve hatalı sorguları azaltır."
Güvenlikİlkeleri:
    - "Kullanıcı sorguları (şirket isimleri vb.) arka uca iletilirken zararsız görünse de, sunucu tarafında parametreleştirilmiş sorgular kullanılmalıdır. 
         ORM kullanılıyorsa bu doğal olarak sağlanır, ancak ham SQL kullanılıyorsa SQL injection riskine karşı önlem alınmalıdır."
    - "Ön yüzde grafik bileşeni, düğüm etiketlerini doğrudan veritabanından gelen metinlerle oluşturur. Bu metinler beklenmedik karakterler içerebilir; 
         XSS saldırılarına alan vermemek için metin içerikleri grafik kütüphanesine eklenmeden önce temizlenmelidir (özellikle innerHTML kullanılmamalı, kütüphanenin data() arayüzü güvenli şekilde kullanılmalıdır)."
    - "Uygulama internete açık bir ortama alınırsa, geniş veri sorguları sistem için ağır olabilir. 
         Bu nedenle kimlik doğrulama ve yetkilendirme mekanizmaları düşünülmeli, gerekirse sorgu başına kayıt veya zaman kısıtları konulmalıdır (rate limiting) ki sistem kötüye kullanılmasın."
Testİlkeleri:
    - "Birimin testleri: `analysis.py` içinde kişi isimleri çıkarma fonksiyonları ve ilişki kurma mantığı için birim testleri yazılmalı. 
         Örneğin, bilinen ilişkileri olan yapay bir şirket-kişi verisetiyle fonksiyonlar test edilip beklenen çıktı (doğru eşleştirmeler) alındığı doğrulanmalı."
    - "Entegrasyon testleri: API üzerinden tam bir sorgu senaryosu test edilmeli. 
         Örneğin, test veritabanında önceden bilinen ilişkileri olan birkaç şirket ve kişi eklendikten sonra, 
         `/relations/{company}` endpoint’ine istek atıldığında gelen JSON yanıtının doğru düğüm ve kenar bilgilerini içerdiği kontrol edilmeli."
    - "Ön yüz testleri: React bileşenleri için, örneğin GraphView ve SearchBar birleşimini içeren bir **component test** yapılabilir. 
         Simüle edilmiş bir arama girişi sonrasında GraphView’in beklenen sayıda düğümü oluşturduğu ve etiketlerin doğru göründüğü test edilmelidir. 
         Ayrıca kritik etkileşimler (düğüme tıklayınca detay göstermek gibi) jest/enzyme ile mümkün olduğunca doğrulanır."
Loglamaİlkeleri:
    - "İlişki sorguları çalıştırıldığında, sunucu tarafında hangi şirket için sorgu yapıldığı ve kaç bağlantı bulunduğu info seviyesinde loglanabilir. 
         Örneğin: 'INFO: Sorgu - Şirket X için 5 ilişkili şirket bulundu'. Bu, sonradan analiz için de faydalı olacaktır."
    - "Olası hata durumları loglanmalı: Örneğin bir şirket adı veritabanında bulunamazsa veya ilişkisel analizde beklenmeyen bir durum oluşursa (boş veri gibi), 
         ilgili uyarı log kayıtları ile geliştiriciye fikir vermelidir (örn. 'WARNING: Şirket X bulunamadı' veya exception traceback)."
    - "Grafik arayüzünde gerçekleşen hataları (örn. veri gelmemesi, API hatası) yakalayıp kullanıcıya bildirirken, arka planda bu hatalar sunucu loglarına da geçmelidir. 
         Böylece istemci tarafında sessiz kalan sorunlar bile sunucuda izlenebilir."
Erişilebilirlikİlkeleri:
    - "Grafiksel arayüz, görme engelli kullanıcılar için doğası gereği zorlayıcı olabilir. Bu nedenle, **alternatif bir metin çıktısı** sunmak değerlidir: 
         Örneğin seçilen şirket ve onun ilişkili şirket/kişi listesi, sayfada metin olarak da listelenebilir (\"Şirket A ile ortak kişiler: Ali Yılmaz (Şirket B, Şirket C’de de yönetici)\", vb.). 
         Bu liste, ekran okuyucular tarafından okunarak grafiğin sunduğu bilgiyi iletebilir."
    - "Düğümlere klavye erişimi sağlanmalıdır. Örneğin TAB tuşu ile grafikteki öğeler arasında gezinebilmek ve Enter/Space ile seçim yapmak mümkün olmalıdır. 
         Cytoscape.js, SVG tabanlı çıktılar ürettiğinden, gerektiğinde SVG elementlerine `tabindex` ve `aria-label` eklenerek erişilebilirlik artırılabilir."
    - "Grafikte renklerle verilen bilgilerin (şirket vs kişi düğümleri, farklı ilişki tipleri için farklı renkli kenarlar gibi) ayrımını, 
         renk algılamada zorluk yaşayanlar için şekil veya desenlerle desteklemek faydalıdır. Örneğin, kişi düğümleri kare, şirket düğümleri daire ikonlarla temsil edilebilir. 
         Kenarlar için de farklı çizgi stilleri (düz, kesikli vb.) kullanılabilir."
