GelişmişÖzellikÖnerileri:
    - "🔍 **Doğal Dil İşleme (NLP) Entegrasyonu:** OCR ile elde edilen metinlerdeki şirket ve kişi adlarını daha akıllı tespit etmek için Türkçe dilinde çalışan bir NLP modeli entegre edilebilir. 
         Örneğin, spaCy kütüphanesinin Türkçe modeli veya Stanza kullanılarak **isim tanıma (NER)** yapılırsa, aynı kişiyi ifade eden farklı yazımlar otomatik yakalanabilir ve ilişki analizi daha doğru hale gelebilir."
    - "⏰ **Periyodik Veri Güncelleme ve Uyarı Mekanizması:** Sistem belirli aralıklarla (örneğin günlük veya haftalık) Ticaret Sicil Gazetesi’ni kontrol ederek yeni yayınlanan şirket kayıtlarını alacak şekilde genişletilebilir. 
         Hatta kullanıcı belirli şirket veya kişileri izlemeye alabilir; eğer bu izlenen ögeler yeni bir kayıtta geçerse sistem kullanıcıya bildirim gönderebilir (e-posta veya uygulama içi uyarı)."
    - "📈 **Tarihsel Analiz ve Zaman Çizelgesi:** Şirketlerin zaman içindeki ilişkilerini izlemek için bir zaman çizelgesi arayüzü eklenebilir. 
         Örneğin, bir şirketin yönetim kadrosundaki değişimler veya şirketler arası ortaklıkların yıllara göre dağılımı interaktif bir grafikle gösterilebilir. 
         Kullanıcı seçtiği bir yıl aralığında hangi bağlantıların aktif olduğunu görebilir. Bu özellik, özellikle geçmiş veriler biriktikçe değerli olacaktır."
    - "💡 **Önemli Kişi ve Şirketlerin Vurgulanması:** Ağ içinde merkezi konumda olan (birçok bağlantısı olan) **kilit kişiler** veya şirketler otomatik tespit edilip vurgulanabilir. 
         Örneğin, çok sayıda şirketin yönetiminde yer alan bir kişi tespit edilirse, grafikte bu düğüm farklı bir renkle öne çıkarılır veya 'Merkez kişi' etiketi alır. 
         Böylece kullanıcı, büyük oyuncuları veya olası holding yapılanmalarını hızlıca fark edebilir."
    - "📄 **Raporlama ve Dışa Aktarım:** Kullanıcının analiz sonuçlarını paylaşabilmesi için raporlama özelliği eklenebilir. 
         Seçilen bir şirket için, o şirketin tüm ilişkilerini listeleyen ve grafiğini içeren bir **PDF raporu** otomatik oluşturulabilir. 
         Alternatif olarak grafik, yüksek çözünürlüklü bir görsel (PNG/SVG) olarak dışa aktarılabilir. Bu sayede sistem, sadece etkileşimli analiz aracı değil, aynı zamanda dokümantasyon aracı olarak da hizmet verir."